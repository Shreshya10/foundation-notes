name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and test
        run: npm ci && npm test

      - name: Set image name
        run: echo "IMAGE=ghcr.io/shreshya10/foundation-notes" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/shreshya10/foundation-notes:latest
            ghcr.io/shreshya10/foundation-notes:${{ github.sha }}
